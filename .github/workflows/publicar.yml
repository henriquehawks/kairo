name: Publicar versão

# Empurre a tag (git tag v0.2.8 && git push origin v0.2.8) e este workflow faz o
# resto. Windows e Linux buildam ao mesmo tempo, cada um guardando os arquivos
# como artefato, e o último job cria a release com os seis de uma vez — por isso
# nada é publicado se qualquer um dos dois buildes falhar.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão sem o v, por exemplo 0.2.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preparar:
    name: Versão e notas
    runs-on: ubuntu-latest
    outputs:
      numero: ${{ steps.versao.outputs.numero }}
      tag: v${{ steps.versao.outputs.numero }}
      notas: ${{ steps.versao.outputs.notas }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versão e notas
        id: versao
        shell: bash
        run: |
          numero="${{ inputs.versao }}"
          if [ -z "$numero" ]; then numero="${GITHUB_REF_NAME#v}"; fi
          notas="docs/releases/$numero.md"
          if [ ! -f "$notas" ]; then
            echo "Faltam as notas da versão em $notas" >&2
            exit 1
          fi
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "notas=$notas" >> "$GITHUB_OUTPUT"

  windows:
    name: Instaladores do Windows
    needs: preparar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Os testes não rodam aqui: pnpm publicar não deixa chegar na tag sem ter
      # passado neles, e o workflow Verificar roda a suíte inteira a cada push.
      - name: Tipos
        run: pnpm verificar

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A chave é a mesma de todas as versões anteriores. Trocá-la deixa quem já
      # tem o app sem conseguir validar a atualização.
      - name: Build assinado
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm lancar ${{ needs.preparar.outputs.numero }} --notas-arquivo ${{ needs.preparar.outputs.notas }}

      - uses: actions/upload-artifact@v4
        with:
          name: kairo-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  linux:
    name: Pacotes Linux
    needs: preparar
    uses: ./.github/workflows/pacotes-linux.yml

  publicar:
    name: Criar a release
    needs: [preparar, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          pattern: kairo-*

      - name: Publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t arquivos < <(find pacotes -type f | sort)
          if [ "${#arquivos[@]}" -lt 6 ]; then
            echo "Esperava os seis arquivos da release, vieram ${#arquivos[@]}:" >&2
            printf '  %s\n' "${arquivos[@]}" >&2
            exit 1
          fi
          printf 'Publicando:\n'
          printf '  %s\n' "${arquivos[@]}"
          gh release create "${{ needs.preparar.outputs.tag }}" "${arquivos[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kairo ${{ needs.preparar.outputs.numero }}" \
            --notes-file "${{ needs.preparar.outputs.notas }}"
